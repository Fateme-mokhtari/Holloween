name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job 1: Lint and test run in parallel with fast feedback
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  # Job 2: Build only runs if lint and tests pass
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          # Baked into the JavaScript at build time (the browser can see these)
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.API_BASE_URL }}
          NEXT_PUBLIC_CARTO_API_KEY: ${{ secrets.NEXT_PUBLIC_CARTO_API_KEY }}
        run: pnpm build

      # Next.js leaves these two folders out of the standalone build on purpose
      - name: Add static files to the standalone build
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static

      # Remove any .env file, then zip; -y keeps pnpm's links as links
      - name: Pack the app
        run: |
          rm -f .next/standalone/.env*
          cd .next/standalone && zip -qry ../../map-app.zip .

      # Only for pushes to main, not for pull requests
      - name: Upload the app
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          path: map-app.zip
          archive: false
          retention-days: 7

  # Job 3: Deploy runs only for pushes to main, after a successful build
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Never run two deploys at the same time
    concurrency: deploy-production
    steps:
      - name: Download the app
        uses: actions/download-artifact@v8
        with:
          name: map-app.zip
          # We unzip it ourselves below, so pnpm's links stay links
          skip-decompress: true

      - name: Unzip the app
        run: |
          unzip -q map-app.zip -d app
          test -f app/server.js

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Copy only what changed into map-app and remove our old files there,
      # but never touch cPanel's tmp folder or the error log
      - name: Upload to the server
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: >
          rsync -az --delete
          --exclude /tmp/ --exclude /stderr.log
          -e "ssh -p 21098 -i ~/.ssh/deploy_key"
          app/ "$SSH_TARGET:map-app/"

      # The server restarts the app when this file changes
      - name: Restart the app
        env:
          SSH_TARGET: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
        run: ssh -p 21098 -i ~/.ssh/deploy_key "$SSH_TARGET" "touch map-app/tmp/restart.txt"
